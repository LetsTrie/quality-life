name: qlife
description: QLife mental health platform - Flutter mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.10+1
  go_router: ^14.8.1
  intl: any
  url_launcher: ^6.3.2
  youtube_player_iframe: ^6.0.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.4
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# Launcher icon generation. Source art lives in assets/launcher/ (rendered from
# the brand-mark SVGs). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/launcher/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2A8C7D"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/illustrations/

  fonts:
    # Noto Sans Bengali — a clean, modern, highly legible Bengali typeface
    # (Google's flagship for the script). Shipped as a single variable TTF; the
    # weight entries below all reference it and the engine resolves the wght
    # axis, so every weight 300–700 renders from one bundled file (fully offline).
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 300
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 700

